<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARTS OF NDN — Grid App for Artists</title>
<style>
:root{
  --bg:#101214;--panel:#191d21;--panel2:#22272d;--text:#f2f4f7;--muted:#aab3bd;
  --accent:#00b887;--border:#343b43;--danger:#ef5350;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--panel2);color:var(--text);cursor:pointer}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--accent);color:#06130f;font-weight:700}
button.danger{background:var(--danger);color:#fff}
button.active{outline:2px solid var(--accent)}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{height:64px;background:#17191c;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:20px;letter-spacing:.4px}
.logo span{color:var(--accent)}
.spacer{flex:1}
.main{display:flex;flex:1;min-height:calc(100vh - 64px)}
.sidebar{width:300px;background:var(--panel);border-right:1px solid var(--border);padding:14px;overflow:auto}
.workspace{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{background:var(--panel);border-bottom:1px solid var(--border);padding:9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.toolbar .group{display:flex;gap:6px;align-items:center;padding-right:8px;border-right:1px solid var(--border)}
.toolbar label{font-size:12px;color:var(--muted)}
.canvasWrap{position:relative;flex:1;overflow:hidden;background:#090a0b;display:flex;align-items:center;justify-content:center;touch-action:none}
#artCanvas{background:#fff;box-shadow:0 8px 35px #000;touch-action:none;max-width:none;max-height:none}
.empty{position:absolute;text-align:center;color:var(--muted);pointer-events:none}
.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
.section{border-bottom:1px solid var(--border);padding:0 0 14px;margin-bottom:14px}
.section h3{font-size:13px;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.row{display:flex;gap:7px;align-items:center;margin:7px 0}
.row>*{flex:1;min-width:0}
.row button{flex:0 0 auto}
input[type=number],input[type=text],select{width:100%;background:#101317;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px}
input[type=color]{width:48px;height:36px;border:0;background:none;padding:0}
input[type=range]{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:8px 0}
.status{padding:7px 12px;background:#111417;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:#252b31;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:100}
.mobileOnly{display:none}
.drawingToolsDisabled{opacity:.42;pointer-events:none;filter:grayscale(1)}
.drawingToolsEnabled{opacity:1;pointer-events:auto}
@media(max-width:850px){
  .sidebar{width:250px}
}
@media(max-width:650px){
  .sidebar{display:none}.mobileOnly{display:block}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <button class="mobileOnly" onclick="toggleSidebar()">☰</button>
  <div class="logo">ARTS OF <span>NDN</span></div>
  <div class="spacer"></div>
  <button onclick="showHome()">Home</button>
  <button onclick="saveProject()">💾 Save</button>
  <button onclick="exportProject()">Project</button>
  <button onclick="document.getElementById('projectInput').click()">Import</button>
</header>
<div class="main">
<aside class="sidebar" id="sidebar">
  <div class="section">
    <h3>Reference image</h3>
    <div class="row"><button class="primary" onclick="pickGallery()">🖼 Gallery</button><button onclick="pickFiles()">📁 Files</button></div>
    <input id="galleryInput" type="file" accept="image/*" hidden onchange="loadImageFile(this.files[0])">
    <input id="fileInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp" hidden onchange="loadImageFile(this.files[0])">
  </div>
  <div class="section">
    <h3>Canvas & Paper Size</h3>
    <div class="row">
      <select id="preset" onchange="applyPreset()">
        <option value="custom">Custom Size</option>
        <option value="a6">A6 (105 × 148 mm)</option>
        <option value="a5">A5 (148 × 210 mm)</option>
        <option value="a4" selected>A4 (210 × 297 mm)</option>
        <option value="a3">A3 (297 × 420 mm)</option>
        <option value="a2">A2 (420 × 594 mm)</option>
        <option value="a1">A1 (594 × 841 mm)</option>
        <option value="a0">A0 (841 × 1189 mm)</option>
        <option value="square">Square (1000 × 1000 px)</option>
      </select>
    </div>
    <div class="row">
      <input id="canvasW" type="number" value="794" min="100">
      <input id="canvasH" type="number" value="1123" min="100">
    </div>
    <div class="row">
      <button onclick="setOrientation('portrait')">Portrait</button>
      <button onclick="setOrientation('landscape')">Landscape</button>
    </div>
    <button class="primary" style="width:100%" onclick="resizeCanvas()">Apply Canvas</button>
  </div>
  <div class="section">
    <h3>Grid Settings</h3>
    <label class="check">
      <input id="squareGrid" type="checkbox" checked onchange="updateGridMode()"> Square Grid
    </label>

    <div id="squareGridControls">
      <div class="row">
        <label>Box size</label>
        <input id="squareSize" type="number" value="1.5" min="0.01" step="0.1" oninput="draw()">
      </div>
      <div class="row">
        <label>Unit</label>
        <select id="squareUnit" onchange="draw()">
          <option value="cm">Centimeters (cm)</option>
          <option value="mm">Millimeters (mm)</option>
          <option value="m">Meters (m)</option>
          <option value="in">Inches (in)</option>
          <option value="ft">Feet (ft)</option>
          <option value="yd">Yards (yd)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <label>Line Color</label>
      <input id="gridColor" type="color" value="#00aa88" onchange="draw()">
    </div>
    <div class="row">
      <label>Thickness</label>
      <input id="gridWidth" type="range" min=".2" max="8" step=".2" value="1" oninput="draw()">
    </div>
    <div class="row">
      <label>Opacity</label>
      <input id="gridOpacity" type="range" min="0" max="1" step=".05" value=".75" oninput="draw()">
    </div>
    <div class="row">
      <label>Style</label>
      <select id="gridStyle" onchange="draw()">
        <option>Solid</option><option>Dashed</option><option>Dotted</option>
      </select>
    </div>
    <label class="check">
      <input id="diagonal" type="checkbox" onchange="draw()"> Diagonal / cross
    </label>
    <label class="check">
      <input id="labels" type="checkbox" onchange="draw()"> Cell labels
    </label>
  </div>
  
  <div class="section">
    <h3>Move / Adjust Image</h3>
    <label class="check">Move X (Horizontal)
      <input id="imgOffsetX" type="range" min="-1000" max="1000" value="0" oninput="draw()">
    </label>
    <label class="check">Move Y (Vertical)
      <input id="imgOffsetY" type="range" min="-1000" max="1000" value="0" oninput="draw()">
    </label>
    <label class="check">Image Scale / Zoom
      <input id="imgScale" type="range" min="0.1" max="3" step="0.05" value="1" oninput="draw()">
    </label>
    <button style="width:100%;margin-bottom:8px;" onclick="resetImagePos()">Center / Reset Position</button>
    <div class="row"><button onclick="rotate(-90)">↶ Rotate</button><button onclick="rotate(90)">↷ Rotate</button></div>
  </div>

  <div class="section">
    <h3>Image Filters</h3>
    <label class="check">Brightness <input id="brightness" type="range" min="0" max="200" value="100" oninput="draw()"></label>
    <label class="check">Contrast <input id="contrast" type="range" min="0" max="200" value="100" oninput="draw()"></label>
    <label class="check">Saturation <input id="saturation" type="range" min="0" max="200" value="100" oninput="draw()"></label>
    <label class="check"><input id="gray" type="checkbox" onchange="draw()"> Grayscale</label>
    <label class="check"><input id="invert" type="checkbox" onchange="draw()"> Invert</label>
  </div>
  
  <div class="section">
    <h3>Drawing Tools</h3>
    <div class="row">
      <button id="drawingToggle" class="primary" style="width:100%" onclick="toggleDrawingMode()">✏ Drawing: OFF</button>
    </div>
    <div id="drawingTools" class="drawingToolsDisabled">
      <div class="row">
        <button id="pencilBtn" class="active" onclick="setTool('pencil')">✏ Pencil</button>
        <button id="eraserBtn" onclick="setTool('eraser')">🧽 Eraser</button>
      </div>
      <div class="row"><label>Color</label><input id="drawColor" type="color" value="#111111"></div>
      <label class="check">Brush size <input id="brushSize" type="range" min="1" max="40" value="4"></label>
      <button class="danger" style="width:100%" onclick="clearDrawing()">Clear Drawing</button>
    </div>
  </div>
</aside>
<section class="workspace">
  <div class="toolbar">
    <div class="group"><button onclick="showHome()">🏠</button><button onclick="pickGallery()">🖼</button></div>
    <div class="group"><button onclick="undo()">↶ Undo</button><button onclick="redo()">↷ Redo</button></div>
    <div class="group"><button onclick="exportPNG()">Export PNG</button><button onclick="exportPDF()">Print/PDF</button></div>
    <div class="spacer"></div>
    <span id="zoomText">100%</span>
  </div>
  <div class="canvasWrap" id="canvasWrap">
    <canvas id="artCanvas" width="794" height="1123"></canvas>
    <div class="empty" id="emptyMsg"><strong>ARTS OF NDN</strong>Select a photo from Gallery or Files</div>
  </div>
  <div class="status" id="status">Ready • No reference image loaded</div>
</section>
</div>
</div>
<script>
const canvas=document.getElementById('artCanvas'),ctx=canvas.getContext('2d');
let refImage=null, rotation=0, drawingMode=false;
let tool='pencil', drawing=false, strokes=[], undoStack=[], redoStack=[];

function $(id){return document.getElementById(id)}

function pickGallery(){$('galleryInput').click()}
function pickFiles(){$('fileInput').click()}
function loadImageFile(file){
 if(!file)return;
 const r=new FileReader();
 r.onload=e=>{const img=new Image();img.onload=()=>{refImage=img;rotation=0;resetImagePos();$('emptyMsg').style.display='none';draw();$('status').textContent='Reference loaded • '+file.name};img.src=e.target.result};
 r.readAsDataURL(file);
}

function resetImagePos(){
  $('imgOffsetX').value = 0;
  $('imgOffsetY').value = 0;
  $('imgScale').value = 1;
  draw();
}

function resizeCanvas(){
 let w=parseInt($('canvasW').value)||800,h=parseInt($('canvasH').value)||1100;
 canvas.width=Math.max(100,Math.min(4000,w));canvas.height=Math.max(100,Math.min(4000,h));
 draw();
}

function applyPreset(){
 const p=$('preset').value;
 // Standard dimensions converted to 96 DPI pixel scale
 const sizes={
   a6:[397,559],
   a5:[559,794],
   a4:[794,1123],
   a3:[1123,1587],
   a2:[1587,2245],
   a1:[2245,3179],
   a0:[3179,4496],
   square:[1000,1000]
 };
 if(sizes[p]){$('canvasW').value=sizes[p][0];$('canvasH').value=sizes[p][1];resizeCanvas()}
}

function setOrientation(o){
 let w=+$('canvasW').value,h=+$('canvasH').value;
 if((o==='landscape'&&h>w)||(o==='portrait'&&w>h)){[$('canvasW').value,$('canvasH').value]=[h,w];resizeCanvas()}
}

function rotate(deg){rotation=(rotation+deg+360)%360;draw()}

function updateGridMode(){
  const isSquare=$('squareGrid').checked;
  $('squareGridControls').style.display=isSquare?'block':'none';
  draw();
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
 if(refImage){
   ctx.save();
   let filters=`brightness(${$('brightness').value}%) contrast(${$('contrast').value}%) saturate(${$('saturation').value}%)`;
   if($('gray').checked)filters+=' grayscale(100%)';
   if($('invert').checked)filters+=' invert(100%)';
   ctx.filter=filters;

   const ang=rotation*Math.PI/180;
   let iw=refImage.width,ih=refImage.height;
   if(rotation%180!==0)[iw,ih]=[ih,iw];

   const userScale = +$('imgScale').value;
   const sc=Math.min(canvas.width/iw,canvas.height/ih) * userScale;
   const w=refImage.width*sc,h=refImage.height*sc;

   const offX = +$('imgOffsetX').value;
   const offY = +$('imgOffsetY').value;

   ctx.translate(canvas.width/2 + offX, canvas.height/2 + offY);
   ctx.rotate(ang);
   ctx.drawImage(refImage,-w/2,-h/2,w,h);
   ctx.restore();
 }
 drawGrid();
 drawDrawingLayer();
}

function drawGrid(){
  ctx.save();
  ctx.globalAlpha=+$('gridOpacity').value;
  ctx.strokeStyle=$('gridColor').value;
  ctx.lineWidth=+$('gridWidth').value;
  
  const style=$('gridStyle').value;
  if(style==='Dashed')ctx.setLineDash([10,8]);
  else if(style==='Dotted')ctx.setLineDash([2,6]);
  else ctx.setLineDash([]);

  let stepX = 80, stepY = 80;

  if($('squareGrid').checked){
    const unit=$('squareUnit').value;
    const size=+$('squareSize').value || 1;
    let pxPerUnit = 37.795; // default 1 cm = 37.8px approx at standard Web PPI

    if(unit==='mm') pxPerUnit = 3.7795;
    if(unit==='m')  pxPerUnit = 3779.5;
    if(unit==='in') pxPerUnit = 96;
    if(unit==='ft') pxPerUnit = 1152;
    if(unit==='yd') pxPerUnit = 3456;

    const cellSize = size * pxPerUnit;
    stepX = cellSize;
    stepY = cellSize;
  }

  for(let x = stepX; x < canvas.width; x += stepX){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();
  }
  for(let y = stepY; y < canvas.height; y += stepY){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  }

  if($('diagonal').checked){
    ctx.setLineDash([]);
    ctx.globalAlpha=Math.min(1,+$('gridOpacity').value*.65);
    for(let x = 0; x < canvas.width; x += stepX){
      for(let y = 0; y < canvas.height; y += stepY){
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+stepX,y+stepY);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+stepX,y);ctx.lineTo(x,y+stepY);ctx.stroke();
      }
    }
  }

  if($('labels').checked){
    ctx.setLineDash([]);
    ctx.fillStyle=$('gridColor').value;
    ctx.font='12px Arial';
    ctx.globalAlpha=1;
    let r=0;
    for(let y = 0; y < canvas.height; y += stepY){
      let c=0;
      for(let x = 0; x < canvas.width; x += stepX){
        ctx.fillText(String.fromCharCode(65+(r%26))+(c+1), x+4, y+16);
        c++;
      }
      r++;
    }
  }

  ctx.restore();
}

function drawDrawingLayer(){
 if(!strokes.length)return;
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 for(const s of strokes){
  ctx.beginPath();ctx.strokeStyle=s.tool==='eraser'?'#ffffff':s.color;ctx.lineWidth=s.size;
  for(let i=0;i<s.points.length;i++){let p=s.points[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();
 }
 ctx.restore();
}

function canvasPoint(e){
 const rect=canvas.getBoundingClientRect();
 return {x:(e.clientX-rect.left)*(canvas.width/rect.width),y:(e.clientY-rect.top)*(canvas.height/rect.height)};
}

canvas.addEventListener('pointerdown',e=>{
 if(!drawingMode)return;
 drawing=true;const p=canvasPoint(e);
 strokes.push({tool,color:$('drawColor').value,size:+$('brushSize').value,points:[p]});
 draw();
});
canvas.addEventListener('pointermove',e=>{
 if(!drawing)return;const p=canvasPoint(e);strokes[strokes.length-1].points.push(p);draw();
});
canvas.addEventListener('pointerup',()=>drawing=false);

function toggleDrawingMode(){
  drawingMode=!drawingMode;
  $('drawingToggle').textContent=drawingMode?'✏ Drawing: ON':'✏ Drawing: OFF';
  $('drawingTools').className=drawingMode?'drawingToolsEnabled':'drawingToolsDisabled';
}

function setTool(t){
  tool=t;
  $('pencilBtn').classList.toggle('active',t==='pencil');
  $('eraserBtn').classList.toggle('active',t==='eraser');
}

function clearDrawing(){strokes=[];draw()}
function exportPNG(){canvas.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='artwork.png';a.click()})}
</script>
</body>
</html>
